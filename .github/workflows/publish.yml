name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install --global npm@11.5.1

      - run: bun install --frozen-lockfile

      - name: Validate release cohort
        run: bun run release:validate --ref "${GITHUB_REF_NAME}"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install Chromium for startup profile
        run: bunx playwright install --with-deps chromium

      - name: Test GUI startup profile
        run: bun run test:startup-profile

      - name: Build
        run: bun run build

      - name: Stage and pack complete release
        run: bun run release:pack --ref "${GITHUB_REF_NAME}"

      - name: Upload immutable release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: .release/bundle
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  smoke:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install --global npm@11.5.1

      - name: Download prepared release bundle
        uses: actions/download-artifact@v5
        with:
          name: release-bundle
          path: .release/bundle

      - name: Clean-install smoke
        run: bun run release:smoke

  publish:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm install --global npm@11.5.1

      - name: Download verified release bundle
        uses: actions/download-artifact@v5
        with:
          name: release-bundle
          path: .release/bundle

      - name: Preflight complete npm cohort
        run: bun run release:preflight

      - name: Publish tarballs with trusted publishing
        run: bun run release:publish
