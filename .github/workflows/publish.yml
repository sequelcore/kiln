name: Publish

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: Validate release tag and package graph
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${VERSION}."
            exit 1
          fi

          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const packagesDir = "packages";
          const packages = fs.readdirSync(packagesDir)
            .map((name) => path.join(packagesDir, name, "package.json"))
            .filter((file) => fs.existsSync(file))
            .map((file) => ({ file, manifest: JSON.parse(fs.readFileSync(file, "utf8")) }));

          const version = packages.find((pkg) => pkg.manifest.name === "@kilnai/core").manifest.version;
          const published = packages.filter((pkg) => pkg.manifest.private !== true);
          const failures = [];

          for (const { file, manifest } of published) {
            if (manifest.version !== version) {
              failures.push(`${file}: expected version ${version}, found ${manifest.version}`);
            }

            for (const section of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              for (const [name, range] of Object.entries(manifest[section] ?? {})) {
                if (!name.startsWith("@kilnai/")) {
                  continue;
                }
                if (range !== `^${version}` && range !== version && range !== "workspace:*") {
                  failures.push(`${file}: ${section}.${name} must target ${version}, found ${range}`);
                }
              }
            }
          }

          if (failures.length > 0) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          NODE

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Resolve workspace versions for publish
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const packagesDir = "packages";
          const version = JSON.parse(fs.readFileSync("packages/core/package.json", "utf8")).version;

          for (const packageName of fs.readdirSync(packagesDir)) {
            const manifestPath = path.join(packagesDir, packageName, "package.json");
            if (!fs.existsSync(manifestPath)) {
              continue;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.private === true) {
              continue;
            }

            for (const section of ["dependencies", "peerDependencies", "optionalDependencies", "devDependencies"]) {
              const deps = manifest[section];
              if (!deps) {
                continue;
              }

              for (const name of Object.keys(deps)) {
                if (name.startsWith("@kilnai/") && deps[name] === "workspace:*") {
                  deps[name] = `^${version}`;
                }
              }
            }

            fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          }
          NODE

      - name: Publish @kilnai/gateway-contracts
        working-directory: packages/gateway-contracts
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kilnai/core
        working-directory: packages/core
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kilnai/runtime
        working-directory: packages/runtime
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kilnai/react
        working-directory: packages/sdk
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kilnai/cli
        working-directory: packages/cli
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kilnai/tui
        working-directory: packages/tui
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @kilnai/widget
        working-directory: packages/widget
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
