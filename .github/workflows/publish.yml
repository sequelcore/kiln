name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build core
        run: bun run --filter @kilnai/core build

      - name: Build runtime
        run: bun run --filter @kilnai/runtime build

      - name: Build tools
        run: bun run --filter @kilnai/tools build

      - name: Build sdk
        run: bun run --filter @kilnai/react build

      - name: Build tui
        run: bun run --filter @kilnai/tui build

      - name: Build cli
        run: bun run --filter @kilnai/cli build

      - name: Build widget
        run: bun run --filter @kilnai/widget build

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          cp .npmrc packages/tools/.npmrc
          cp .npmrc packages/tools-darwin-arm64/.npmrc
          cp .npmrc packages/tools-darwin-x64/.npmrc
          cp .npmrc packages/tools-linux-x64/.npmrc
          cp .npmrc packages/tools-win32-x64/.npmrc
          cp .npmrc packages/core/.npmrc
          cp .npmrc packages/runtime/.npmrc
          cp .npmrc packages/sdk/.npmrc
          cp .npmrc packages/cli/.npmrc
          cp .npmrc packages/tui/.npmrc
          cp .npmrc packages/widget/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve workspace versions
        run: |
          VERSION=$(jq -r .version packages/core/package.json)
          for pkg in packages/*; do
            if [ "$(jq -r '.private // false' "$pkg/package.json")" = "true" ]; then
              continue
            fi
            jq --arg v "^$VERSION" '
              if has("peerDependencies") then
                .peerDependencies |= with_entries(if .value == "workspace:*" then .value = $v else . end)
              else
                .
              end
              | if has("dependencies") then
                  .dependencies |= with_entries(if .value == "workspace:*" then .value = $v else . end)
                else
                  .
                end
              | if has("optionalDependencies") then
                  .optionalDependencies |= with_entries(if .value == "workspace:*" then .value = $v else . end)
                else
                  .
                end
              | if has("devDependencies") then
                  .devDependencies |= with_entries(if .value == "workspace:*" then .value = $v else . end)
                else
                  .
                end
            ' "$pkg/package.json" > tmp.json && mv tmp.json "$pkg/package.json"
          done

      - name: Publish @kilnai/tools-darwin-arm64
        working-directory: packages/tools-darwin-arm64
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/tools-darwin-x64
        working-directory: packages/tools-darwin-x64
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/tools-linux-x64
        working-directory: packages/tools-linux-x64
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/tools-win32-x64
        working-directory: packages/tools-win32-x64
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/tools
        working-directory: packages/tools
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/core
        working-directory: packages/core
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/runtime
        working-directory: packages/runtime
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/react
        working-directory: packages/sdk
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/tui
        working-directory: packages/tui
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/cli
        working-directory: packages/cli
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/widget
        working-directory: packages/widget
        run: bun publish --access public --no-git-checks
