name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build core
        run: bun run --filter @kilnai/core build

      - name: Build runtime
        run: bun run --filter @kilnai/runtime build

      - name: Build sdk
        run: bun run --filter @kilnai/react build

      - name: Build cli
        run: bun run --filter @kilnai/cli build

      - name: Build widget
        run: bun run --filter @kilnai/widget build

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          cp .npmrc packages/core/.npmrc
          cp .npmrc packages/runtime/.npmrc
          cp .npmrc packages/sdk/.npmrc
          cp .npmrc packages/cli/.npmrc
          cp .npmrc packages/widget/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve workspace versions
        run: |
          VERSION=$(jq -r .version packages/core/package.json)
          for pkg in packages/runtime packages/sdk packages/cli; do
            jq --arg v "^$VERSION" '
              (.peerDependencies // {}) |= with_entries(if .value == "workspace:*" then .value = $v else . end) |
              (.dependencies // {}) |= with_entries(if .value == "workspace:*" then .value = $v else . end)
            ' "$pkg/package.json" > tmp.json && mv tmp.json "$pkg/package.json"
          done

      - name: Publish @kilnai/core
        working-directory: packages/core
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/runtime
        working-directory: packages/runtime
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/react
        working-directory: packages/sdk
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/cli
        working-directory: packages/cli
        run: bun publish --access public --no-git-checks

      - name: Publish @kilnai/widget
        working-directory: packages/widget
        run: bun publish --access public --no-git-checks
