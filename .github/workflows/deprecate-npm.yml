name: Deprecate npm Versions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Deprecate experimental pre-2.0 packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node <<'NODE'
          const { spawnSync } = require("node:child_process");

          const currentPackages = [
            "@kilnai/core",
            "@kilnai/runtime",
            "@kilnai/react",
            "@kilnai/cli",
            "@kilnai/tui",
            "@kilnai/widget",
          ];

          const retiredToolPackages = [
            "@kilnai/tools",
            "@kilnai/tools-darwin-arm64",
            "@kilnai/tools-darwin-x64",
            "@kilnai/tools-linux-x64",
            "@kilnai/tools-win32-x64",
          ];

          const targets = [
            ...currentPackages.map((name) => ({
              name,
              range: "<2.0.0",
              message: `Experimental pre-2.0 releases are deprecated. Please upgrade to ${name}@2.0.0 or later.`,
            })),
            ...retiredToolPackages.map((name) => ({
              name,
              range: "<2.0.0",
              message: "Experimental pre-2.0 tool packages are deprecated and are not part of the Kiln 2.0 public package line.",
            })),
          ];

          for (const target of targets) {
            const spec = `${target.name}@${target.range}`;
            console.log(`Deprecating ${spec}`);
            const result = spawnSync("npm", ["deprecate", spec, target.message], {
              stdio: "inherit",
              env: process.env,
            });
            if (result.status !== 0) {
              process.exit(result.status ?? 1);
            }
          }
          NODE
