name: Kiln workspace
description: Check out dependencies, restore the Bun package cache, and install the workspace.

inputs:
  compiled:
    description: Download the compiled package output produced by the compile job.
    required: false
    default: "false"
  playwright:
    description: Restore the Playwright browser cache alongside the Bun package cache.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    - name: Cache Bun packages
      if: ${{ inputs.playwright != 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Cache Bun packages and Playwright browsers
      if: ${{ inputs.playwright == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.bun/install/cache
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-bun-playwright-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-playwright-

    - name: Install workspace
      shell: bash
      run: bun install --frozen-lockfile

    - name: Download compiled packages
      if: ${{ inputs.compiled == 'true' }}
      uses: actions/download-artifact@v4
      with:
        name: compiled-packages
        path: packages
