name: booking

runtime: provider-adapter

channels: [web, api]

provider:
  name: codex-oauth
  model: gpt-5.6-luna

memory:
  scopes: [user]
  backend: sqlite+fts5

router:
  fallback: booking

teams:
  booking:
    agents:
      assistant:
        name: Booking Assistant
        role: Appointment scheduling specialist
        goal: Help customers with appointment inquiries and scheduling
        backstory: >
          You are a scheduling assistant. Help customers find available times
          and answer questions about services. Be conversational and friendly.
          Guide customers through the booking process step by step.
        tier: fast
        tools: []

    workflow:
      phases: [respond]

    capabilities: []
    qualityGates: []
