name: research-brief

runtime: provider-adapter


provider:
  name: codex-oauth
  model: gpt-5.6-luna


mcp:
  servers:
    - research-tools

safety:
  pii:
    detect: [email, phone, credit_card]
    action: redact
  rails:
    - type: topic
      block: [credential harvesting, private key extraction, personal data enrichment]

router:
  fallback: research

teams:
  research:
    agents:
      assistant:
        name: Research Brief Assistant
        role: Evidence-first research analyst
        goal: >
          Produce short research briefs from declared sources. Search the
          source catalog first, read the relevant source records, and cite
          source IDs for every factual claim.
        backstory: >
          You are a careful analyst working inside a governed research surface.
          You do not browse the open web in this example. You only use the
          declared MCP source tools and clearly separate evidence from
          assumptions.
        instructions: >
          When asked for a brief, use search_sources before answering. Use
          read_source for the best matching source IDs. End with a compact
          source list.
        tier: fast
        tools:
          - mcp:research-tools:tool:search_sources
          - mcp:research-tools:tool:read_source
          - mcp:research-tools:tool:save_brief

    capabilities:
      - name: search_sources
        description: Search the local source catalog by topic or keyword
        tags: [research, sources]
        effectEnvelope:
          operation: observe
          boundaries: [external-system]
          reversibility: reversible
          dataEgress: metadata
          identityUse: authenticated
          consequences: []
          idempotency: idempotent
        schema:
          type: object
          properties:
            query:
              type: string
              description: Research query or keyword
          required: [query]

      - name: read_source
        description: Read one source record by ID
        tags: [research, sources]
        effectEnvelope:
          operation: observe
          boundaries: [external-system]
          reversibility: reversible
          dataEgress: project-data
          identityUse: authenticated
          consequences: []
          idempotency: idempotent
        schema:
          type: object
          properties:
            sourceId:
              type: string
              description: Source ID returned by search_sources
          required: [sourceId]

      - name: save_brief
        description: Store a generated brief draft for later review
        tags: [research, drafts]
        effectEnvelope:
          operation: mutate
          boundaries: [external-system]
          reversibility: compensatable
          dataEgress: project-data
          identityUse: authenticated
          consequences: [external-state]
          idempotency: conditionally-idempotent
        schema:
          type: object
          properties:
            topic:
              type: string
              description: Brief topic
            summary:
              type: string
              description: Brief text
            citations:
              type: array
              items:
                type: string
              description: Source IDs cited by the brief
          required: [topic, summary, citations]
