version: "1"
mcp:
  servers:
    research-tools:
      transport: streamable-http
      url: http://localhost:3400/mcp
      admission:
        state: admitted
        tools: { allow: [search_sources, read_source, save_brief] }
        effects:
          search_sources: &read
            operation: observe
            boundaries: [external-system]
            reversibility: reversible
            dataEgress: metadata
            identityUse: none
            consequences: []
            idempotency: idempotent
          read_source: *read
      trust: local
