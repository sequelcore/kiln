version: "1"
mcp:
  servers:
    support-tools:
      transport: streamable-http
      url: http://localhost:3100/mcp
      admission:
        state: admitted
        tools: { allow: [check_order_status, get_account_info, create_support_ticket] }
        effects:
          check_order_status: &read
            operation: observe
            boundaries: [external-system]
            reversibility: reversible
            dataEgress: metadata
            identityUse: none
            consequences: []
            idempotency: idempotent
          get_account_info: *read
      trust: local
