<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechShop Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #e5e5e5; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 16px 24px; border-bottom: 1px solid #262626; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; font-weight: 600; }
    #status { width: 8px; height: 8px; border-radius: 50%; background: #737373; }
    #status.connected { background: #22c55e; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .msg { max-width: 640px; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #1d4ed8; color: #fff; }
    .msg.assistant { align-self: flex-start; background: #262626; }
    .msg.system { align-self: center; color: #737373; font-size: 13px; }
    .hints { padding: 8px 24px; color: #525252; font-size: 13px; line-height: 1.6; }
    .hints code { background: #171717; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    form { padding: 16px 24px; border-top: 1px solid #262626; display: flex; gap: 12px; }
    input { flex: 1; padding: 12px 16px; background: #171717; border: 1px solid #262626; border-radius: 8px; color: #e5e5e5; font-size: 14px; outline: none; }
    input:focus { border-color: #3b82f6; }
    input:disabled { opacity: 0.5; }
    button { padding: 12px 24px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <div id="status"></div>
    <h1>TechShop Support</h1>
  </header>
  <div class="hints">
    Try: <code>What's the status of order ORD-1002?</code> &middot;
    <code>Look up account alice@example.com</code> &middot;
    <code>Create a ticket about a damaged item</code>
  </div>
  <div id="messages"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Describe your issue..." autocomplete="off" disabled>
    <button type="submit" disabled>Send</button>
  </form>

  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const button = form.querySelector("button");
    const status = document.getElementById("status");

    const WS_URL = "ws://localhost:3000/apps/support-agent/ws?userId=customer-1";
    let ws;

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function connect() {
      ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        status.classList.add("connected");
        input.disabled = false;
        button.disabled = false;
        addMessage("Connected to TechShop Support. How can we help?", "system");
        input.focus();
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "done" && data.content) {
          addMessage(data.content, "assistant");
          input.disabled = false;
          button.disabled = false;
          input.focus();
        }
      };

      ws.onclose = () => {
        status.classList.remove("connected");
        input.disabled = true;
        button.disabled = true;
        addMessage("Disconnected. Reconnecting...", "system");
        setTimeout(connect, 2000);
      };

      ws.onerror = () => ws.close();
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;

      addMessage(text, "user");
      ws.send(JSON.stringify({ type: "message", content: text }));
      input.value = "";
      input.disabled = true;
      button.disabled = true;
    });

    connect();
  </script>
</body>
</html>
