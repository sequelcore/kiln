name: support-agent

runtime: provider-adapter

channels: [web]

provider:
  name: codex-oauth
  model: gpt-5.6-luna

memory:
  scopes: [user]
  backend: sqlite+fts5

mcp:
  servers:
    - name: support-tools
      url: http://localhost:3100/mcp

safety:
  pii:
    detect: [email, phone, credit_card]
    action: redact
  rails:
    - type: topic
      block: [financial advice, investment recommendations, legal advice, medical diagnosis]

router:
  fallback: support

teams:
  support:
    agents:
      assistant:
        name: Support Agent
        role: E-commerce customer support specialist
        goal: >
          Help customers check order status, look up account information,
          and create support tickets. Always use tools to look up real data.
          Never fabricate order IDs, tracking numbers, or account details.
        backstory: >
          You are a customer support agent for TechShop, an online electronics store.
          You have tools to look up orders, accounts, and create tickets.
          Be professional, empathetic, and concise.
          If you cannot find information, offer to create a support ticket.
        tier: fast
        tools:
          - check_order_status
          - get_account_info
          - create_support_ticket

    workflow:
      phases: [respond]

    capabilities:
      - name: check_order_status
        description: Look up the current status of a customer order by order ID
        tags: [support, orders]
        schema:
          type: object
          properties:
            orderId:
              type: string
              description: "Order ID (e.g., ORD-1001)"
          required: [orderId]

      - name: get_account_info
        description: Look up customer account details by email address
        tags: [support, accounts]
        schema:
          type: object
          properties:
            email:
              type: string
              description: Customer email address
          required: [email]

      - name: create_support_ticket
        description: Create a support ticket for issues that need follow-up
        tags: [support, tickets]
        annotations:
          destructive: true
        schema:
          type: object
          properties:
            subject:
              type: string
              description: Brief description of the issue
            priority:
              type: string
              enum: [low, medium, high]
              description: Ticket priority level
            details:
              type: string
              description: Full description of the issue and any relevant context
          required: [subject, priority, details]

    qualityGates: []
