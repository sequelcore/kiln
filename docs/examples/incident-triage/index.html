<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiln Incident Triage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #e5e5e5; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; height: 100vh; }
    header { align-items: center; border-bottom: 1px solid #262626; display: flex; gap: 12px; padding: 16px 24px; }
    header h1 { font-size: 16px; font-weight: 600; }
    #status { background: #737373; border-radius: 50%; height: 8px; width: 8px; }
    #status.connected { background: #22c55e; }
    .hints { color: #a3a3a3; font-size: 13px; line-height: 1.6; padding: 10px 24px; }
    .hints code { background: #171717; border-radius: 4px; padding: 2px 6px; }
    #messages { display: flex; flex: 1; flex-direction: column; gap: 16px; overflow-y: auto; padding: 24px; }
    .msg { border-radius: 8px; line-height: 1.5; max-width: 720px; padding: 12px 16px; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #1d4ed8; color: white; }
    .msg.assistant { align-self: flex-start; background: #262626; }
    .msg.system { align-self: center; color: #737373; font-size: 13px; padding: 0; }
    form { border-top: 1px solid #262626; display: flex; gap: 12px; padding: 16px 24px; }
    input { background: #171717; border: 1px solid #262626; border-radius: 8px; color: #e5e5e5; flex: 1; font-size: 14px; outline: none; padding: 12px 16px; }
    input:focus { border-color: #3b82f6; }
    button { background: #2563eb; border: 0; border-radius: 8px; color: white; cursor: pointer; font-size: 14px; padding: 12px 24px; }
    input:disabled, button:disabled { cursor: default; opacity: 0.5; }
  </style>
</head>
<body>
  <header>
    <div id="status"></div>
    <h1>Incident Triage</h1>
  </header>
  <div class="hints">
    Try <code>Gateway latency is high, triage it</code> or <code>Open a sev2 for memory index lag</code>
  </div>
  <div id="messages"></div>
  <form id="form">
    <input id="input" type="text" placeholder="Describe an operational symptom..." autocomplete="off" disabled>
    <button type="submit" disabled>Send</button>
  </form>
  <script>
    const messages = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const button = form.querySelector("button");
    const status = document.getElementById("status");
    const WS_URL = "ws://localhost:3000/apps/incident-triage/ws?userId=operator-1";
    let ws;

    function addMessage(text, role) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function setReady(ready) {
      input.disabled = !ready;
      button.disabled = !ready;
      if (ready) input.focus();
    }

    function connect() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => {
        status.classList.add("connected");
        setReady(true);
        addMessage("Connected. Describe the incident symptom.", "system");
      };
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "done" && data.content) {
          addMessage(data.content, "assistant");
          setReady(true);
        }
      };
      ws.onclose = () => {
        status.classList.remove("connected");
        setReady(false);
        addMessage("Disconnected. Reconnecting...", "system");
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      addMessage(text, "user");
      ws.send(JSON.stringify({ type: "message", content: text }));
      input.value = "";
      setReady(false);
    });

    connect();
  </script>
</body>
</html>
