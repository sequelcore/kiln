version: "1"
mcp:
  servers:
    incident-tools:
      transport: streamable-http
      url: http://localhost:3500/mcp
      admission:
        state: admitted
        tools: { allow: [list_services, get_service_status, get_runbook, open_incident, append_timeline_note] }
        effects:
          list_services: &read
            operation: observe
            boundaries: [external-system]
            reversibility: reversible
            dataEgress: metadata
            identityUse: none
            consequences: []
            idempotency: idempotent
          get_service_status: *read
          get_runbook: *read
      trust: local
