name: booking-assistant

runtime: provider-adapter


provider:
  name: codex-oauth
  model: gpt-5.6-luna


mcp:
  servers:
    - booking-tools

billing:
  budgetEndpoint: http://localhost:3300/budget?tenantId={userId}
  overBudgetMessage: "Our assistant is temporarily unavailable. Please try again later or contact us directly."
  headers:
    X-Gateway-Secret: $GATEWAY_SECRET

triggers:
  - name: booking-confirmed
    type: webhook
    path: /hooks/confirmed
    team: booking
    method: POST
    task: "Booking confirmed: {{payload.customerName}} for {{payload.service}} on {{payload.date}} at {{payload.time}}"

router:
  fallback: booking

teams:
  booking:
    agents:
      assistant:
        name: Booking Assistant
        role: Appointment scheduling specialist
        goal: >
          Help customers browse available appointments, book slots, and manage
          existing bookings. Always confirm details before creating a booking.
          Use tools to check real availability -- never guess or fabricate slots.
        backstory: >
          You are a friendly scheduling assistant for a local business.
          You help customers find and book appointment slots for various services.
          Be conversational, helpful, and confirm all details before booking.
          When listing available slots, present them in a clear, organized format.
        tools:
          - mcp:booking-tools:tool:list_available_slots
          - mcp:booking-tools:tool:create_booking
          - mcp:booking-tools:tool:cancel_booking

    capabilities:
      - name: list_available_slots
        description: List available appointment slots for a given date and optional service filter
        tags: [booking, calendar]
        effectEnvelope:
          operation: observe
          boundaries: [external-system]
          reversibility: reversible
          dataEgress: metadata
          identityUse: authenticated
          consequences: []
          idempotency: idempotent
        schema:
          type: object
          properties:
            date:
              type: string
              description: "Date in YYYY-MM-DD format"
            service:
              type: string
              description: "Optional service name to filter slots by"
          required: [date]

      - name: create_booking
        description: Book an appointment slot for a customer
        tags: [booking, calendar]
        effectEnvelope:
          operation: mutate
          boundaries: [external-system]
          reversibility: compensatable
          dataEgress: project-data
          identityUse: authenticated
          consequences: [external-state]
          idempotency: conditionally-idempotent
        schema:
          type: object
          properties:
            date:
              type: string
              description: "Date in YYYY-MM-DD format"
            time:
              type: string
              description: "Time in HH:MM format (24h)"
            service:
              type: string
              description: "Service name"
            customerName:
              type: string
              description: "Customer's full name"
            customerPhone:
              type: string
              description: "Customer's phone number (optional)"
          required: [date, time, service, customerName]

      - name: cancel_booking
        description: Cancel an existing booking by its booking ID
        tags: [booking, calendar]
        effectEnvelope:
          operation: mutate
          boundaries: [external-system]
          reversibility: compensatable
          dataEgress: metadata
          identityUse: authenticated
          consequences: [external-state]
          idempotency: conditionally-idempotent
        schema:
          type: object
          properties:
            bookingId:
              type: string
              description: "Booking ID (e.g., BK-1001)"
          required: [bookingId]
