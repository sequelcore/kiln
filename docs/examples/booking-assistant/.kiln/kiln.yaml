version: "1"
mcp:
  servers:
    booking-tools:
      transport: streamable-http
      url: http://localhost:3200/mcp
      admission:
        state: admitted
        tools: { allow: [list_available_slots, create_booking, cancel_booking] }
        effects:
          list_available_slots:
            operation: observe
            boundaries: [external-system]
            reversibility: reversible
            dataEgress: metadata
            identityUse: none
            consequences: []
            idempotency: idempotent
      trust: local
