# Voice capability example.
# This is an app-level contract example, not a provider secret file.

name: voice-capability-example
channels: [api, web, whatsapp, instagram, messenger]

memory:
  scopes: [user]
  backend: sqlite+fts5

router:
  rules: []
  fallback: assistant

voice:
  stt:
    provider: openai
    model: gpt-4o-transcribe
    apiKeyEnv: OPENAI_API_KEY
    language: es
  tts:
    provider: openai
    model: gpt-4o-mini-tts
    apiKeyEnv: OPENAI_API_KEY
    voice: alloy
  defaults:
    ttsProfile: assistant-default
  ttsProfiles:
    assistant-default:
      style: calm, concise customer assistant
      voice: alloy
      language: es
      speed: 1
      speedRange: [0.95, 1.05]
      format: mp3
      intents:
        neutral:
          delivery: Use the profile's normal delivery.
          appliesWhen:
            - Default spoken response when no more specific intent applies.
          speed: 1
        calm:
          delivery: Slightly slower and steadier delivery.
          appliesWhen:
            - Errors, support friction, or sensitive user messages.
          speed: 0.97
        brief:
          delivery: Slightly quicker delivery for short confirmations.
          appliesWhen:
            - Short acknowledgements, status updates, and confirmations.
          speed: 1.03
        careful:
          delivery: Slower and more deliberate delivery for instructions.
          appliesWhen:
            - Step-by-step guidance, safety-sensitive instructions, or dense technical explanations.
          speed: 0.96
  policy:
    defaultInputFailureMode: fail-open
    defaultOutputFailureMode: fail-closed
    artifacts:
      storeSourceAudio: true
      storeTranscripts: true
      storeSynthesizedAudio: true
      retentionMaxArtifacts: 50
    surfaces:
      api:
        enabled: true
        output:
          modes: [audio-response, transcript-only]
      whatsapp:
        enabled: true
        input:
          modes: [audio-part]
          failureMode: fail-open
        output:
          modes: [audio-response, transcript-only]
          failureMode: fail-closed
      instagram:
        enabled: true
        input:
          modes: [audio-part]
          failureMode: fail-open
        output:
          modes: [audio-response, transcript-only]
          failureMode: fail-closed
      messenger:
        enabled: true
        input:
          modes: [audio-part]
          failureMode: fail-open
        output:
          modes: [audio-response, transcript-only]
          failureMode: fail-closed
      gui:
        enabled: true
        input:
          modes: [microphone, file]
        output:
          modes: [audio-on-demand, transcript-only]
          failureMode: fail-closed
      sdk:
        enabled: true
        input:
          modes: [audio-part, file]
        output:
          modes: [audio-response, transcript-only]
      widget:
        enabled: true
        input:
          modes: [microphone, file]
        output:
          modes: [audio-response, transcript-only]
      tui:
        enabled: true
        input:
          modes: [file]
        output:
          modes: [audio-on-demand, transcript-only]
      recorder:
        enabled: true
        output:
          modes: [artifact-only]

teams:
  assistant:
    agents:
      worker:
        name: Voice Assistant
        role: Generalist assistant
        goal: Answer user requests with governed voice input and output policy
        tier: coding
        tools: []
        voiceProfile: assistant-default
    workflow:
      phases: [respond]
      gates: {}
    capabilities: []
    qualityGates: []
