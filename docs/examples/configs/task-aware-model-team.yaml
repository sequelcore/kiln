# Sanitized task-aware model team example.
# Copy the shape, not the exact model list. Credentials stay in environment
# variables or Kiln credential pools, never in this file.
# This example is subscription-first: direct Codex OAuth and OpenCode Go/Zen are
# normal routes; native CLI harness engines stay disabled unless intentionally
# selected as fallback escape hatches.
version: "1"
engines:
  codex-oauth:
    enabled: true
    billing: subscription
  opencode-go:
    enabled: true
    billing: subscription
  opencode-zen:
    enabled: true
    billing: api-key
  codex:
    enabled: false
    billing: plus-quota
  opencode:
    enabled: false
    billing: free
routing:
  defaultWorker: codex-oauth
  fallback: opencode-zen
  routes:
    - provider: codex-oauth
      model: gpt-5.5
    - provider: opencode-go
      model: kimi-k2.6
    - provider: opencode-go
      model: glm-5.1
    - provider: opencode-go
      model: deepseek-v4-pro
    - provider: opencode-go
      model: qwen3.6-plus
    - provider: opencode-go
      model: minimax-m2.7
    - provider: opencode-go
      model: deepseek-v4-flash
    - provider: opencode-zen
      model: minimax-m2.5-free
  budgetAware: false
models:
  codex-oauth: gpt-5.5
  opencode-go: minimax-m2.7
  opencode-zen: minimax-m2.5-free
reasoningPolicy:
  default: medium
  unsupported: omit
  byTask:
    architecture-review: xhigh
    backend-coding: high
    frontend-design: high
    test-writing: high
    research: high
    mechanical-edit: low
modelTaskSuitability:
  - provider: codex-oauth
    model: gpt-5.5
    task: architecture-review
    level: preferred
    reason: Prefer the highest-reasoning subscription route for architecture decisions, backend-critical changes, and final review.
  - provider: opencode-go
    model: kimi-k2.6
    task: frontend-design
    level: preferred
    reason: Prefer the OpenCode Go frontend route for UI, layout, and visual implementation.
  - provider: opencode-go
    model: glm-5.1
    task: backend-coding
    level: capable
    reason: Keep GLM available for backend services, adapters, and data-flow reasoning when the preferred backend route is unavailable.
  - provider: opencode-go
    model: deepseek-v4-pro
    task: backend-coding
    level: preferred
    reason: Prefer the OpenCode Go backend/debugging route for complex coding and provider/runtime issues.
  - provider: opencode-go
    model: qwen3.6-plus
    task: research
    level: preferred
    reason: Prefer the OpenCode Go research route for synthesis and comparison work.
  - provider: opencode-go
    model: deepseek-v4-flash
    task: mechanical-edit
    level: preferred
    reason: Prefer the fast OpenCode Go route for repetitive or low-risk edits.
  - provider: opencode-go
    model: minimax-m2.7
    task: mechanical-edit
    level: capable
    reason: Keep MiniMax as an efficient all-rounder fallback for mechanical work.
skills:
  selection:
    mode: auto
  builtin:
    enabled: true
    include:
      - repo-context-review
      - codebase-scouting
      - implementation-planning
      - tdd-workflow
      - code-review-findings
      - clean-architecture-boundary-review
      - ddd-boundary-review
      - refactoring-safety
      - security-scope-review
      - managed-agent-risk-review
      - benchmark-readiness-review
      - config-projection-review
managedAgents:
  enabled: true
  defaultProvider: codex-oauth
  defaultProfile: foundation-readonly-plan
  requireApproval: true
  # Read-only managed routes are derived from routing.routes. Keep this list
  # for authority-bearing routes and deliberate exceptions only.
  routes:
    - id: codex-oauth-scout-readonly
      kind: direct
      provider: codex-oauth
      model: gpt-5.4-mini
      profiles:
        - foundation-readonly-plan
      workingDirectory: project
      timeoutMs: 120000
      tools:
        allowed:
          - read
          - tree
          - grep
          - glob
        network: false
        writes: false
      memory:
        access: read-only
      credentials:
        mode: runtime-selected
    - id: codex-oauth-critical-approved-write
      kind: direct
      provider: codex-oauth
      model: gpt-5.5
      profiles:
        - foundation-apply-approved-writes
      workingDirectory: project
      timeoutMs: 120000
      tools:
        allowed:
          - read
          - tree
          - grep
          - glob
          - write
          - edit
          - apply-patch
        network: false
        writes: true
      memory:
        access: write-proposals
      credentials:
        mode: runtime-selected
      writeAuthority:
        workspace:
          mode: apply-approved
          allowedPaths:
            - "."
          deniedPaths:
            - .git
            - node_modules
            - .kiln
        approval:
          mode: required-before-apply
