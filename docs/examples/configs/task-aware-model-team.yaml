# Sanitized global V7 intent for an account-backed model team. Managed facts
# are admitted separately and selected by the exact evidence revision below.
version: "7"

identity: { name: Alex, timezone: America/Tijuana }

targetCatalog:
  # Example digest only. A real setup publishes the admitted snapshot first.
  evidenceRevision: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  accounts:
    - id: codex-oauth-primary
      providerId: codex-oauth
      credentialId: codex-oauth-primary
      maxConcurrency: 1
      reservedAffinitySlots: 0
      economics: { creditPosture: disabled, overagePosture: disabled }
    - id: codex-oauth-secondary
      providerId: codex-oauth
      credentialId: codex-oauth-secondary
      maxConcurrency: 1
      reservedAffinitySlots: 0
      economics: { creditPosture: disabled, overagePosture: disabled }
    - id: opencode-go-primary
      providerId: opencode-go
      credentialId: opencode-go-primary
      maxConcurrency: 1
      reservedAffinitySlots: 0
      economics: { creditPosture: disabled, overagePosture: disabled }
  accountPolicies:
    - { id: codex-oauth-automatic, accountIds: [codex-oauth-primary, codex-oauth-secondary], strategy: economic-least-pressure }
    - { id: opencode-go-automatic, accountIds: [opencode-go-primary], strategy: economic-least-pressure }
  targets:
    - id: codex-terra
      kind: direct
      label: Terra - balanced implementation
      providerId: codex-oauth
      providerModelId: gpt-5.6-terra
      dataClassification: internal
      accountPolicyId: codex-oauth-automatic
      economics: &subscription-intent
        authBillingChannel: oauth-subscription
        executionMode: direct
        serviceTier: standard
        fallbackPosture: disabled
        overagePosture: disabled
        executionEnvelope: { limits: [] }
    - id: codex-sol
      kind: direct
      label: Sol - architecture and review
      providerId: codex-oauth
      providerModelId: gpt-5.6-sol
      dataClassification: internal
      accountPolicyId: codex-oauth-automatic
      economics: *subscription-intent
    - id: codex-luna
      kind: direct
      label: Luna - bounded mechanical edits
      providerId: codex-oauth
      providerModelId: gpt-5.6-luna
      dataClassification: internal
      accountPolicyId: codex-oauth-automatic
      economics: *subscription-intent
    - id: opencode-go-glm
      kind: direct
      label: GLM - approved service work
      providerId: opencode-go
      providerModelId: glm-5.2
      dataClassification: internal
      accountPolicyId: opencode-go-automatic
      economics: *subscription-intent

targetRouting: { defaultTargetId: codex-terra }
ui: { targetSelection: { targetId: codex-terra } }

modelGateway:
  port: 4819
  replay: { ttlMs: 300000, maxEntries: 1000, hmacKeyEnv: KILN_MODEL_GATEWAY_REPLAY_HMAC_KEY }
  codexComposite: { maxQueuedRequests: 32, queueTimeoutMs: 30000 }
  surfaces:
    openAIResponses: { maxBodyBytes: 67108864, maxConcurrentRequests: 8 }
  principals:
    - tokenEnv: KILN_CODEX_TOKEN
      ingress: openai-responses
      nativeHarness: codex
      tenantId: example-team
      applicationId: codex
      callerId: example-operator
      capabilityId: model-invoke
      scopes: [model.invoke]
      budgetEvidenceId: example-subscription-budget
      virtualModelIds: [managed-codex-terra, managed-codex-sol, managed-codex-luna, managed-opencode-go-glm]
  virtualModels:
    - { id: managed-codex-terra, displayName: Codex Terra through Kiln, contextTokens: 200000, outputTokens: 8192, baseInstructions: Use caller instructions and tools., targetId: codex-terra, capabilities: [text], affinity: { continuity: none } }
    - { id: managed-codex-sol, displayName: Codex Sol through Kiln, contextTokens: 200000, outputTokens: 8192, baseInstructions: Use caller instructions and tools., targetId: codex-sol, capabilities: [text], affinity: { continuity: none } }
    - { id: managed-codex-luna, displayName: Codex Luna through Kiln, contextTokens: 200000, outputTokens: 8192, baseInstructions: Use caller instructions and tools., targetId: codex-luna, capabilities: [text], affinity: { continuity: none } }
    - { id: managed-opencode-go-glm, displayName: GLM through Kiln, contextTokens: 200000, outputTokens: 8192, baseInstructions: Use caller instructions and tools., targetId: opencode-go-glm, capabilities: [text], affinity: { continuity: none } }
