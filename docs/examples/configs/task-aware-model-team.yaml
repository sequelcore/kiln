# Sanitized global V2 configuration for an account-backed model team.
# Route labels carry the work intent. GUI, TUI, and `kiln run` select a route;
# Kiln selects an eligible account automatically. Credential IDs are opaque
# references resolved by the credential subsystem, never secret material.
version: "2"

identity:
  name: Alex
  timezone: America/Tijuana

executionCatalog:
  accounts:
    - id: codex-oauth-primary
      providerId: codex-oauth
      credentialId: codex-oauth-primary
      maxConcurrency: 1
      reservedAffinitySlots: 0
      economics:
        capacityIdentity: codex-oauth-primary
        subscriptionClass: subscription
        quotaClassId: codex-oauth-primary
        creditPosture: disabled
        overagePosture: disabled
    - id: codex-oauth-secondary
      providerId: codex-oauth
      credentialId: codex-oauth-secondary
      maxConcurrency: 1
      reservedAffinitySlots: 0
      economics:
        capacityIdentity: codex-oauth-secondary
        subscriptionClass: subscription
        quotaClassId: codex-oauth-secondary
        creditPosture: disabled
        overagePosture: disabled
    - id: opencode-go-primary
      providerId: opencode-go
      credentialId: opencode-go-primary
      maxConcurrency: 1
      reservedAffinitySlots: 0
      economics:
        capacityIdentity: opencode-go-primary
        subscriptionClass: subscription
        quotaClassId: opencode-go-primary
        creditPosture: disabled
        overagePosture: disabled

  accountPolicies:
    - id: codex-oauth-automatic
      accountIds:
        - codex-oauth-primary
        - codex-oauth-secondary
      strategy: economic-least-pressure
    - id: opencode-go-automatic
      accountIds:
        - opencode-go-primary
      strategy: economic-least-pressure

  routes:
    - id: codex-terra
      label: Terra — balanced implementation
      providerId: codex-oauth
      providerModelId: gpt-5.6-terra
      accountSelection:
        mode: automatic
        accountPolicyId: codex-oauth-automatic
      economics:
        adapterCapabilityId: codex-oauth-direct
        adapterCapabilityVersion: v1
        authBillingChannel: oauth-subscription
        executionMode: direct
        serviceTier: standard
        rateCardBasis: provider-subscription
        envelopeSemantics: configured-upper-bound
        fallbackPosture: disabled
        overagePosture: disabled
        contextClass: standard-context
        cacheClass: provider-cache
        priceEvidence:
          kind: subscription
          rateCardId: codex-oauth-subscription
          rateCardRevision: rev-2026-08
          evidence:
            sourceIdentity: operator-subscription-terms
            sourceRevision: rev-2026-08
            sourceDigest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            observedAt: 2026-08-01T00:00:00.000Z
            validUntil: 2026-09-01T00:00:00.000Z
            confidence: high
            authority: provider-reported
        auxiliaryCharges: []
        executionEnvelope:
          limits: []
    - id: codex-sol
      label: Sol — architecture and review
      providerId: codex-oauth
      providerModelId: gpt-5.6-sol
      accountSelection:
        mode: automatic
        accountPolicyId: codex-oauth-automatic
      economics:
        adapterCapabilityId: codex-oauth-direct
        adapterCapabilityVersion: v1
        authBillingChannel: oauth-subscription
        executionMode: direct
        serviceTier: standard
        rateCardBasis: provider-subscription
        envelopeSemantics: configured-upper-bound
        fallbackPosture: disabled
        overagePosture: disabled
        contextClass: standard-context
        cacheClass: provider-cache
        priceEvidence:
          kind: subscription
          rateCardId: codex-oauth-subscription
          rateCardRevision: rev-2026-08
          evidence:
            sourceIdentity: operator-subscription-terms
            sourceRevision: rev-2026-08
            sourceDigest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            observedAt: 2026-08-01T00:00:00.000Z
            validUntil: 2026-09-01T00:00:00.000Z
            confidence: high
            authority: provider-reported
        auxiliaryCharges: []
        executionEnvelope:
          limits: []
    - id: codex-luna
      label: Luna — bounded mechanical edits
      providerId: codex-oauth
      providerModelId: gpt-5.6-luna
      accountSelection:
        mode: automatic
        accountPolicyId: codex-oauth-automatic
      economics:
        adapterCapabilityId: codex-oauth-direct
        adapterCapabilityVersion: v1
        authBillingChannel: oauth-subscription
        executionMode: direct
        serviceTier: standard
        rateCardBasis: provider-subscription
        envelopeSemantics: configured-upper-bound
        fallbackPosture: disabled
        overagePosture: disabled
        contextClass: standard-context
        cacheClass: provider-cache
        priceEvidence:
          kind: subscription
          rateCardId: codex-oauth-subscription
          rateCardRevision: rev-2026-08
          evidence:
            sourceIdentity: operator-subscription-terms
            sourceRevision: rev-2026-08
            sourceDigest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            observedAt: 2026-08-01T00:00:00.000Z
            validUntil: 2026-09-01T00:00:00.000Z
            confidence: high
            authority: provider-reported
        auxiliaryCharges: []
        executionEnvelope:
          limits: []
    - id: opencode-go-glm
      label: GLM — approved service work
      providerId: opencode-go
      providerModelId: glm-5.2
      accountSelection:
        mode: automatic
        accountPolicyId: opencode-go-automatic
      economics:
        adapterCapabilityId: opencode-go-direct
        adapterCapabilityVersion: v1
        authBillingChannel: oauth-subscription
        executionMode: direct
        serviceTier: standard
        rateCardBasis: provider-subscription
        envelopeSemantics: configured-upper-bound
        fallbackPosture: disabled
        overagePosture: disabled
        contextClass: standard-context
        cacheClass: provider-cache
        priceEvidence:
          kind: subscription
          rateCardId: opencode-go-subscription
          rateCardRevision: rev-2026-08
          evidence:
            sourceIdentity: operator-subscription-terms
            sourceRevision: rev-2026-08
            sourceDigest: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            observedAt: 2026-08-01T00:00:00.000Z
            validUntil: 2026-09-01T00:00:00.000Z
            confidence: high
            authority: provider-reported
        auxiliaryCharges: []
        executionEnvelope:
          limits: []

executionRouting:
  defaultRouteId: codex-terra

# The initial GUI/TUI preference names a route, not a provider or credential.
ui:
  executionRouteSelection:
    routeId: codex-terra

# Model Gateway is an ingress and virtual-name overlay. The canonical provider,
# model, account policy, and economics remain in executionCatalog.
modelGateway:
  port: 4819
  replay:
    ttlMs: 300000
    maxEntries: 1000
    hmacKeyEnv: KILN_MODEL_GATEWAY_REPLAY_HMAC_KEY
  surfaces:
    openAIResponses:
      maxBodyBytes: 1048576
      maxConcurrentRequests: 8
  principals:
    - tokenEnv: KILN_MODEL_GATEWAY_BEARER_TOKEN
      ingress: openai-responses
      tenantId: example-team
      applicationId: example-client
      callerId: example-operator
      capabilityId: model-invoke
      scopes:
        - model.invoke
      budgetEvidenceId: example-subscription-budget
      virtualModelIds:
        - managed-codex-terra
        - managed-codex-sol
        - managed-codex-luna
        - managed-opencode-go-glm
  virtualModels:
    - id: managed-codex-terra
      executionRouteId: codex-terra
      capabilities:
        - text
      affinity:
        continuity: none
    - id: managed-codex-sol
      executionRouteId: codex-sol
      capabilities:
        - text
      affinity:
        continuity: none
    - id: managed-codex-luna
      executionRouteId: codex-luna
      capabilities:
        - text
      affinity:
        continuity: none
    - id: managed-opencode-go-glm
      executionRouteId: opencode-go-glm
      capabilities:
        - text
      affinity:
        continuity: none

managedAgents:
  schemaVersion: 2
  enabled: true
  defaultProfile: foundation-readonly-plan
  requireApproval: true
  routes:
    - id: architecture-review
      kind: direct
      executionRouteId: codex-sol
      profiles:
        - foundation-readonly-plan
      workingDirectory: project
      tools:
        allowed:
          - read
          - tree
          - grep
          - glob
        network: false
        writes: false
      memory:
        access: read-only
    - id: approved-service-work
      kind: direct
      executionRouteId: opencode-go-glm
      profiles:
        - foundation-apply-approved-writes
      workingDirectory: project
      tools:
        allowed:
          - read
          - tree
          - grep
          - glob
          - write
          - edit
          - apply-patch
        network: false
        writes: true
      memory:
        access: write-proposals
      writeAuthority:
        workspace:
          mode: apply-approved
          allowedPaths:
            - .
          deniedPaths:
            - .git
            - node_modules
            - .kiln
        approval:
          mode: required-before-apply
  economicPolicies:
    - id: subscription-priority
      revision: rev-2026-08
      evidenceRequirements:
        quota: required-for-account-bound
        price: required
      noRouteAction: deny
      comparisonDomains:
        - id: subscription-priority
          rank: 0
          unit: request
          scheme:
            kind: unit
          rateCardBasis: provider-subscription
          envelopeSemantics: configured-upper-bound
      candidates:
        - routeId: architecture-review
          comparisonDomainId: subscription-priority
          priorityRank: 0
          ceiling:
            kind: none
          worstCaseReservation:
            kind: not-comparable
            reason: subscription-basis
        - routeId: approved-service-work
          comparisonDomainId: subscription-priority
          priorityRank: 1
          ceiling:
            kind: none
          worstCaseReservation:
            kind: not-comparable
            reason: subscription-basis

skills:
  selection:
    mode: auto
  builtin:
    enabled: true
    include:
      - repo-context-review
      - codebase-scouting
      - implementation-planning
      - tdd-workflow
      - code-review-findings
      - clean-architecture-boundary-review
      - ddd-boundary-review
      - refactoring-safety
      - security-scope-review
      - managed-agent-risk-review
      - benchmark-readiness-review
      - config-projection-review

permissions:
  approval: on-request
  sandbox: read-only

workGovernance:
  defaultPosture: orchestrate
  directExecution:
    maxFiles: 1
    maxRisk: low
  requireDelegationFor:
    - architecture
    - security
    - ui
    - runtime
    - provider-routing
    - managed-agents
    - config
    - multi-file
    - cross-surface
    - long-running
    - verification-heavy
    - formal-proof-candidate
  requiredEvidence:
    - surface-map
    - risk-hypothesis
    - plan
    - tests
    - typecheck
    - residual-risk

activeInstructionProfiles:
  - sequel-engineering
