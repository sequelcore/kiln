# Sanitized task-aware model team example.
# Copy the shape, not the exact model list. Credentials stay in environment
# variables or Kiln credential pools, never in this file.
# This example is subscription-first: direct Codex OAuth and OpenCode Go are
# normal routes; native CLI harness engines stay disabled unless intentionally
# selected as fallback escape hatches.
# OpenCode Go DeepSeek V4 Flash is intentionally absent because its current
# provider matrix permits model training and has no retention agreement.
version: "1"
engines:
  codex-oauth:
    enabled: true
    billing: subscription
  opencode-go:
    enabled: true
    billing: subscription
  codex:
    enabled: false
    billing: plus-quota
  opencode:
    enabled: false
    billing: free
routing:
  defaultWorker: codex-oauth
  fallback: opencode-go
  routes:
    - provider: codex-oauth
      model: gpt-5.6-terra
    - provider: codex-oauth
      model: gpt-5.6-sol
    - provider: codex-oauth
      model: gpt-5.6-luna
    - provider: opencode-go
      model: kimi-k2.7-code
    - provider: opencode-go
      model: glm-5.2
    - provider: opencode-go
      model: deepseek-v4-pro
    - provider: opencode-go
      model: qwen3.7-max
  budgetAware: false
models:
  codex-oauth: gpt-5.6-terra
  opencode-go: glm-5.2
modelGateway:
  port: 4819
  accounts:
    - id: codex-subscription
      providerId: codex-oauth
      credentialId: codex-subscription
      maxConcurrency: 1
      reservedAffinitySlots: 0
    - id: opencode-go-subscription
      providerId: opencode-go
      credentialId: opencode-go-subscription
      maxConcurrency: 1
      reservedAffinitySlots: 0
  replay:
    ttlMs: 300000
    maxEntries: 1000
    hmacKeyEnv: KILN_MODEL_GATEWAY_REPLAY_HMAC_KEY
  surfaces:
    openAIResponses:
      maxBodyBytes: 1048576
      maxConcurrentRequests: 8
  principals:
    - tokenEnv: KILN_MODEL_GATEWAY_BEARER_TOKEN
      ingress: openai-responses
      tenantId: example-team
      applicationId: example-client
      callerId: example-operator
      capabilityId: model-invoke
      scopes:
        - model.invoke
      budgetEvidenceId: example-subscription-budget
      virtualModelIds:
        - managed-codex-luna
        - managed-codex-sol
        - managed-opencode-go-kimi
        - managed-opencode-go-glm
        - managed-opencode-go-deepseek-pro
        - managed-opencode-go-qwen
  virtualModels:
    - id: managed-codex-luna
      providerId: codex-oauth
      providerModelId: gpt-5.6-luna
      accountIds: [codex-subscription]
      capabilities: [text]
      affinity: { continuity: none }
    - id: managed-codex-sol
      providerId: codex-oauth
      providerModelId: gpt-5.6-sol
      accountIds: [codex-subscription]
      capabilities: [text]
      affinity: { continuity: none }
    - id: managed-opencode-go-kimi
      providerId: opencode-go
      providerModelId: kimi-k2.7-code
      accountIds: [opencode-go-subscription]
      capabilities: [text]
      affinity: { continuity: none }
    - id: managed-opencode-go-glm
      providerId: opencode-go
      providerModelId: glm-5.2
      accountIds: [opencode-go-subscription]
      capabilities: [text]
      affinity: { continuity: none }
    - id: managed-opencode-go-deepseek-pro
      providerId: opencode-go
      providerModelId: deepseek-v4-pro
      accountIds: [opencode-go-subscription]
      capabilities: [text]
      affinity: { continuity: none }
    - id: managed-opencode-go-qwen
      providerId: opencode-go
      providerModelId: qwen3.7-max
      accountIds: [opencode-go-subscription]
      capabilities: [text]
      affinity: { continuity: none }
reasoningPolicy:
  default: medium
  unsupported: omit
  byTask:
    architecture-review: xhigh
    backend-coding: high
    frontend-design: high
    test-writing: high
    research: high
    mechanical-edit: low
modelTaskSuitability:
  - provider: codex-oauth
    model: gpt-5.6-sol
    task: architecture-review
    level: preferred
    reason: Prefer GPT-5.6 Sol for architecture decisions, backend-critical changes, and final review.
  - provider: codex-oauth
    model: gpt-5.6-terra
    task: backend-coding
    level: preferred
    reason: Prefer GPT-5.6 Terra as the balanced workday Codex route for everyday implementation.
  - provider: codex-oauth
    model: gpt-5.6-luna
    task: mechanical-edit
    level: preferred
    reason: Prefer GPT-5.6 Luna for small bounded edits and repetitive low-risk work.
  - provider: opencode-go
    model: kimi-k2.7-code
    task: frontend-design
    level: preferred
    reason: Prefer the OpenCode Go frontend route for UI, layout, and visual implementation.
  - provider: opencode-go
    model: glm-5.2
    task: backend-coding
    level: capable
    reason: Keep GLM available for backend services, adapters, and data-flow reasoning when the preferred backend route is unavailable.
  - provider: opencode-go
    model: deepseek-v4-pro
    task: backend-coding
    level: preferred
    reason: Prefer the OpenCode Go backend/debugging route for complex coding and provider/runtime issues.
  - provider: opencode-go
    model: qwen3.7-max
    task: research
    level: preferred
    reason: Prefer the OpenCode Go research route for synthesis and comparison work.
skills:
  selection:
    mode: auto
  builtin:
    enabled: true
    include:
      - repo-context-review
      - codebase-scouting
      - implementation-planning
      - tdd-workflow
      - code-review-findings
      - clean-architecture-boundary-review
      - ddd-boundary-review
      - refactoring-safety
      - security-scope-review
      - managed-agent-risk-review
      - benchmark-readiness-review
      - config-projection-review
managedAgents:
  enabled: true
  defaultProvider: codex-oauth
  defaultProfile: foundation-readonly-plan
  requireApproval: true
  # Read-only managed routes are derived from routing.routes. Keep this list
  # for authority-bearing routes and deliberate exceptions only.
  routes:
    - id: codex-oauth-scout-readonly
      kind: direct
      provider: codex-oauth
      model: gpt-5.6-luna
      profiles:
        - foundation-readonly-plan
      workingDirectory: project
      timeoutMs: 300000
      tools:
        allowed:
          - read
          - tree
          - grep
          - glob
        network: false
        writes: false
      memory:
        access: read-only
      credentials:
        mode: runtime-selected
        accountPolicyId: managed-codex-luna
    # Only GLM 5.2 passed the 2026-08-01 strict backend write admission.
    - id: opencode-go-service-approved-write
      kind: direct
      provider: opencode-go
      model: glm-5.2
      profiles:
        - foundation-apply-approved-writes
      workingDirectory: project
      timeoutMs: 120000
      tools:
        allowed:
          - read
          - tree
          - grep
          - glob
          - write
          - edit
          - apply-patch
        network: false
        writes: true
      memory:
        access: write-proposals
      credentials:
        mode: runtime-selected
        accountPolicyId: managed-opencode-go-glm
      writeAuthority:
        workspace:
          mode: apply-approved
          allowedPaths:
            - "."
          deniedPaths:
            - .git
            - node_modules
            - .kiln
        approval:
          mode: required-before-apply
permissions:
  approval: on-request
  sandbox: read-only
identity:
  name: Alex
  timezone: America/Tijuana
workGovernance:
  defaultPosture: orchestrate
  directExecution:
    maxFiles: 1
    maxRisk: low
  requireDelegationFor:
    - architecture
    - security
    - ui
    - runtime
    - provider-routing
    - managed-agents
    - config
    - multi-file
    - cross-surface
    - long-running
    - verification-heavy
    - formal-proof-candidate
  requiredEvidence:
    - surface-map
    - risk-hypothesis
    - plan
    - tests
    - typecheck
    - residual-risk
activeInstructionProfiles:
  - sequel-engineering
