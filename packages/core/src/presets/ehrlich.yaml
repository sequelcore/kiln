# Ehrlich Preset -- scientific investigation orchestration on the engine
# 3 agents, 6-phase workflow, 20 core capabilities, scoped memory
# Named after Paul Ehrlich, pioneer of systematic experimental methodology

name: ehrlich
channels: [web, api]

memory:
  scopes: [user, "agent:director", "agent:researcher", "agent:summarizer", "project:default"]
  backend: postgresql

router:
  rules: []
  fallback: investigation

teams:
  investigation:
    agents:
      director:
        tier: reasoning
        tools: []
        structured: true
      researcher:
        tier: coding
        tools:
          - ehrlich_propose_hypothesis
          - ehrlich_design_experiment
          - ehrlich_evaluate_hypothesis
          - ehrlich_record_finding
          - ehrlich_record_negative_control
          - ehrlich_search_prior_research
          - ehrlich_query_uploaded_data
          - ehrlich_conclude_investigation
          - ehrlich_search_literature
          - ehrlich_search_citations
          - ehrlich_get_reference
          - ehrlich_run_statistical_test
          - ehrlich_run_categorical_test
        count: 2
        sandbox: true
      summarizer:
        tier: fast
        tools:
          - ehrlich_classify_domain
          - ehrlich_compress_output
          - ehrlich_grade_evidence

    workflow:
      phases: [classification, literature, formulation, testing, controls, synthesis]
      gates:
        formulation:
          requires: [human_approval]
        testing:
          requires: [hypotheses_approved]
        synthesis:
          requires: [evidence_graded]
      maxIterations: 3

    capabilities:
      # Investigation lifecycle (8)
      - name: ehrlich_propose_hypothesis
        description: Propose a testable hypothesis with expected outcomes and falsifiability criteria
        tags: [investigation]
      - name: ehrlich_design_experiment
        description: Design an experiment with variables, controls, sample size, and methodology
        tags: [investigation]
      - name: ehrlich_evaluate_hypothesis
        description: Evaluate a hypothesis against collected evidence using GRADE framework
        tags: [investigation]
      - name: ehrlich_record_finding
        description: Record a structured finding with data, interpretation, and confidence level
        tags: [investigation]
      - name: ehrlich_record_negative_control
        description: Record a negative control result to validate experimental methodology
        tags: [investigation]
      - name: ehrlich_search_prior_research
        description: Search prior research and existing knowledge base for related work
        tags: [investigation]
      - name: ehrlich_query_uploaded_data
        description: Query and analyze uploaded datasets with structured filters
        tags: [investigation]
      - name: ehrlich_conclude_investigation
        description: Conclude the investigation with summary, limitations, and future directions
        tags: [investigation]

      # Literature (3)
      - name: ehrlich_search_literature
        description: Search academic literature via Semantic Scholar and arXiv APIs
        tags: [literature]
      - name: ehrlich_search_citations
        description: Search citations and references for a given paper or DOI
        tags: [literature]
      - name: ehrlich_get_reference
        description: Retrieve full reference metadata for a paper by DOI or identifier
        tags: [literature]

      # Statistics (2)
      - name: ehrlich_run_statistical_test
        description: Run a statistical test (t-test, ANOVA, regression) on collected data
        tags: [statistics]
      - name: ehrlich_run_categorical_test
        description: Run categorical tests (chi-square, Fisher exact) on frequency data
        tags: [statistics]

      # Domain (2)
      - name: ehrlich_classify_domain
        description: Classify the investigation domain (molecular, training, nutrition, impact)
        tags: [domain]
      - name: ehrlich_detect_domain
        description: Auto-detect investigation domain from uploaded data and context
        tags: [domain]

      # Compression (1)
      - name: ehrlich_compress_output
        description: Compress verbose output into structured summaries with key findings
        tags: [compression]

      # Evidence (1)
      - name: ehrlich_grade_evidence
        description: Grade evidence quality using GRADE-adapted framework (high/moderate/low/very low)
        tags: [evidence]

      # Visualization (1)
      - name: ehrlich_render_visualization
        description: Render data visualization (charts, plots, diagrams) from experimental results
        tags: [visualization]

      # Cost (2)
      - name: ehrlich_cost_track
        description: Track token usage and cost for an agent interaction
        tags: [cost]
      - name: ehrlich_cost_summary
        description: Get cost breakdown by role and total for the investigation session
        tags: [cost]

    qualityGates:
      - name: evidence_threshold
        command: "ehrlich verify --evidence-threshold"
        description: Verify all findings meet minimum evidence quality threshold
        required: true
      - name: reproducibility_check
        command: "ehrlich verify --reproducibility"
        description: Check that experiments have documented methodology for reproducibility
        required: true
      - name: bias_assessment
        command: "ehrlich verify --bias"
        description: Assess and document potential biases in experimental design and interpretation
        required: true
