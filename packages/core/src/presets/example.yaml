# Example Preset -- coding orchestration on the engine
# 3 agents, 6-phase workflow, shared resources, scoped memory policy

name: example


router:
  fallback: development

teams:
  development:
    agents:
      architect:
        name: Aria
        role: Senior Architect
        goal: Design robust, maintainable solutions with minimal complexity
        tier: reasoning
        tools: []
      worker:
        name: Marcus
        role: Implementation Specialist
        goal: Write clean, well-tested code that follows team conventions
        tier: coding
        tools:
          - resource_list
          - resource_template_list
          - resource_read
          - kiln_phase_gate
          - kiln_task_create
          - kiln_task_score
          - kiln_task_action
          - kiln_verify
          - kiln_cost_track
      optimizer:
        name: Zoe
        role: Performance Optimizer
        goal: Optimize code and queries for maximum performance
        tier: fast
        tools:
          - resource_list
          - resource_read
          - kiln_cost_summary

    capabilities:
      - name: kiln_init
        description: Initialize a session with task and context
        tags: [session]
      - name: kiln_phase_start
        description: Start a new phase in the workflow
        tags: [orchestrator]
      - name: resource_list
        description: List shared Kiln resources available to the current session
        tags: [resources]
      - name: resource_template_list
        description: List shared Kiln resource templates, including Memory Lattice templates
        tags: [resources, memory]
      - name: resource_read
        description: Read a bounded kiln:// resource URI such as kiln://memory/graph
        tags: [resources, memory]
      - name: kiln_phase_gate
        description: Check and enforce phase transition gates
        tags: [orchestrator]
      - name: kiln_task_create
        description: Create a new task in the exploration tree
        tags: [tasks]
      - name: kiln_task_score
        description: Score and rank tasks by priority and evidence
        tags: [tasks]
      - name: kiln_task_action
        description: Apply tree action (deepen, branch, prune) to a task
        tags: [tasks]
      - name: kiln_verify
        description: Execute quality gates (test, lint, typecheck)
        tags: [verification]
      - name: kiln_cost_track
        description: Track token usage and cost for an agent interaction
        tags: [cost]
      - name: kiln_cost_summary
        description: Get cost breakdown by role and total
        tags: [cost]
      - name: kiln_domain_detect
        description: Auto-detect project tech stack from file patterns
        tags: [domain]
