# Example Preset -- coding orchestration on the engine
# 3 agents, 6-phase workflow, 13 MCP tools, scoped memory

name: example
channels: [cli, web]

memory:
  scopes: [user, "agent:architect", "agent:worker", "agent:optimizer", "project:default"]
  backend: sqlite+fts5
  sync: git

router:
  rules: []
  fallback: development

teams:
  development:
    agents:
      architect:
        tier: reasoning
        tools: []
        structured: true
      worker:
        tier: coding
        tools:
          - kiln_memory_save
          - kiln_memory_recall
          - kiln_phase_gate
          - kiln_task_create
          - kiln_task_score
          - kiln_task_action
          - kiln_verify
          - kiln_cost_track
        count: 2
        sandbox: true
      optimizer:
        tier: fast
        tools:
          - kiln_memory_save
          - kiln_memory_search
          - kiln_cost_summary

    workflow:
      phases: [analyze, research, architect, implement, verify, synthesize]
      gates:
        architect:
          requires: [human_approval]
        verify:
          requires: [tests_pass, typecheck, lint]
      maxIterations: 3

    capabilities:
      - name: kiln_init
        description: Initialize a session with task and context
        tags: [session]
      - name: kiln_phase_start
        description: Start a new phase in the workflow
        tags: [orchestrator]
      - name: kiln_memory_save
        description: Save a new memory entry to scoped storage
        tags: [memory]
      - name: kiln_memory_recall
        description: Recall memories by query with token budget
        tags: [memory]
      - name: kiln_memory_search
        description: Full-text search across memory scopes
        tags: [memory]
      - name: kiln_phase_gate
        description: Check and enforce phase transition gates
        tags: [orchestrator]
      - name: kiln_task_create
        description: Create a new task in the exploration tree
        tags: [tasks]
      - name: kiln_task_score
        description: Score and rank tasks by priority and evidence
        tags: [tasks]
      - name: kiln_task_action
        description: Apply tree action (deepen, branch, prune) to a task
        tags: [tasks]
      - name: kiln_verify
        description: Execute quality gates (test, lint, typecheck)
        tags: [verification]
      - name: kiln_cost_track
        description: Track token usage and cost for an agent interaction
        tags: [cost]
      - name: kiln_cost_summary
        description: Get cost breakdown by role and total
        tags: [cost]
      - name: kiln_domain_detect
        description: Auto-detect project tech stack from file patterns
        tags: [domain]

    qualityGates:
      - name: typecheck
        command: "tsc --noEmit"
        description: Type-check TypeScript source
        required: true
      - name: test
        command: "vitest run"
        description: Run test suite
        required: true
      - name: lint
        command: "biome check"
        description: Lint and format code
        required: true
