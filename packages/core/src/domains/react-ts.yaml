name: react-ts
displayName: React + TypeScript
detectPatterns:
  - tsconfig.json
  - package.json
  - src/App.tsx
  - src/main.tsx
  - vite.config.ts
toolTags:
  - filesystem
  - terminal
  - browser
  - testing
qualityGates:
  - name: typecheck
    command: "tsc --noEmit"
    description: Type-check TypeScript source
    required: true
  - name: test
    command: "vitest run"
    description: Run Vitest test suite
    required: true
  - name: lint
    command: "biome check ."
    description: Lint and format code
    required: false
multishotExamples: |
  When creating React components, always use functional components with TypeScript.
  Use named exports. Prefer composition over inheritance.
  Use React.memo() only when profiling shows a performance issue.
phaseExamples: |
  architect: Design component hierarchy and state management approach.
  implement: Write components, hooks, and tests following project conventions.
  verify: Run typecheck, tests, and lint before marking complete.
