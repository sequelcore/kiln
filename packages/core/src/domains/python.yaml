name: python
displayName: Python
detectPatterns:
  - requirements.txt
  - pyproject.toml
  - setup.py
  - Pipfile
  - poetry.lock
toolTags:
  - filesystem
  - terminal
  - testing
qualityGates:
  - name: typecheck
    command: "mypy ."
    description: Type-check Python source with mypy
    required: true
  - name: test
    command: "pytest"
    description: Run pytest test suite
    required: true
  - name: lint
    command: "ruff check ."
    description: Lint Python code with Ruff
    required: false
multishotExamples: |
  Follow PEP 8 conventions. Use type hints on all function signatures.
  Prefer dataclasses or Pydantic models for structured data.
  Write docstrings for public functions and classes.
phaseExamples: |
  architect: Design module structure and class hierarchy.
  implement: Write modules, classes, and tests following Python best practices.
  verify: Run mypy, pytest, and ruff before marking complete.
