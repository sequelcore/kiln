name: data-pipeline
displayName: Data Pipeline
detectPatterns:
  - dbt_project.yml
  - airflow/
  - prefect.yaml
  - dagster.yaml
  - pipeline.yaml
toolTags:
  - filesystem
  - terminal
  - database
  - testing
qualityGates:
  - name: schema-validate
    command: "dbt compile"
    description: Validate data models compile
    required: true
  - name: test
    command: "dbt test"
    description: Run data quality tests
    required: true
multishotExamples: |
  Design idempotent transformations. Validate data at boundaries.
  Document data lineage and transformation logic.
  Write tests for data quality assertions, not just row counts.
phaseExamples: |
  architect: Design data model relationships and transformation DAG.
  implement: Write models, transformations, and data quality tests.
  verify: Compile models, run tests, and validate output schemas.
