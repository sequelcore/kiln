port: 4800
apps:
  - name: atendia
    config: apps/multi-tenant-app.yaml
    channels:
      - type: api
        path: /api/atendia
        multiTenant: true
      - type: whatsapp
        multiTenant: true
        verifyTokenEnv: WA_VERIFY_TOKEN
        adminTokenEnv: ADMIN_TOKEN
  - name: standard-app
    config: apps/app-a.yaml
    channels:
      - type: api
        path: /api/standard
