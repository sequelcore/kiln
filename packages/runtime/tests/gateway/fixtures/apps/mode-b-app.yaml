name: test-mode-b
runtime: provider-adapter

provider:
  name: anthropic
  model: claude-haiku-4-5-20251001
  apiKeyEnv: ANTHROPIC_API_KEY

billing:
  budgetEndpoint: https://api.example.com/users/{userId}/ai-budget
  overBudgetMessage: "Budget exhausted."
  tiers:
    free:
      agents: [fast]
    pro:
      agents: [fast, coding]


router:
  fallback: assistant

teams:
  assistant:
    agents:
      conversant:
        name: Conversant Agent
        role: conversational assistant
        goal: Respond helpfully to user queries
        tools: []
    capabilities: []
