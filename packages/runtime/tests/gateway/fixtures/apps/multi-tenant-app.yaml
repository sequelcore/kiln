name: atendia
runtime: provider-adapter
channels: [api, whatsapp]

provider:
  name: anthropic
  model: claude-haiku-4-5-20251001
  apiKeyEnv: ANTHROPIC_API_KEY

billing:
  budgetEndpoint: https://api.example.com/users/{userId}/ai-budget
  overBudgetMessage: "Presupuesto agotado."

memory:
  scopes: [user]
  backend: sqlite+fts5

router:
  rules: []
  fallback: assistant

teams:
  assistant:
    agents:
      conversant:
        tier: fast
        tools: []
    workflow:
      phases: [understand, respond]
      gates: {}
    capabilities: []
    qualityGates: []
