<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kiln Browser Host Proof</title>
    <style>
      body {
        min-height: 1400px;
        margin: 0;
        background: #0b0d10;
        color: #f3f5f7;
        font: 16px system-ui, sans-serif;
      }

      main {
        padding: 24px;
      }

      input {
        width: 240px;
        padding: 10px 12px;
        border: 1px solid #65707d;
        background: #11161d;
        color: #f3f5f7;
      }
    </style>
  </head>
  <body>
    <main>
      <label for="proof-input">Proof input</label>
      <input id="proof-input" aria-label="Proof input" />
      <p id="proof-status">Ready</p>
    </main>
    <script>
      document.getElementById("proof-input").addEventListener("input", (event) => {
        document.getElementById("proof-status").textContent = event.target.value;
      });
    </script>
  </body>
</html>
