version: "1"
maxDepth: 3
parallelWorkers: 3
contextGovernance:
  turnBudget: 12000
web:
  enabled: true
  netPolicy: full
interactiveUse:
  enabled: true
  browserProvider: playwright
  browserEnvironment: isolated-headless
  allowedDomains:
    - "*"
  allowComputer: true
  computerProvider: windows-uia
  computerEnvironment: local-active-desktop
  allowedApplications:
    - Calculator
    - msedge
    - notepad
  applicationAliases:
    Calculator:
      - Calculadora
      - CalculatorApp
      - calc
      - ApplicationFrameHost
    msedge:
      - Edge
      - Microsoft Edge
    notepad:
      - Notepad
      - Bloc de notas
      - notas
permissions:
  approval: on-request
  sandbox: workspace-write
  tools:
    - tool: work_governance.*
      action: allow
      reason: Governed Kiln turns must be able to assess work without interactive tool approval.
    - tool: work_profile.list
      action: allow
      reason: Governed Kiln turns need read-only access to configured work profiles.
    - tool: goal.*
      action: allow
      reason: Governed Kiln turns materialize approved orchestration goals through control-plane tools.
    - tool: work_item.*
      action: allow
      reason: Governed Kiln turns materialize and close out scoped work items through control-plane tools.
    - tool: managed_agent.*
      action: allow
      reason: Governed Kiln turns delegate scoped work through managed child agent tools.
    - tool: kiln_config.read
      action: allow
      reason: Governed Kiln turns may inspect effective configuration without mutating it.
    - tool: tool_catalog_search
      action: allow
      reason: Governed Kiln turns may discover available control-plane tools without execution authority.
    - tool: memory_search
      action: allow
      reason: Governed Kiln turns may search governed read-only memory context.
    - tool: read
      action: allow
      reason: Governed Kiln turns may inspect files for planning and review.
    - tool: tree
      action: allow
      reason: Governed Kiln turns may map repository surfaces for planning and review.
    - tool: grep
      action: allow
      reason: Governed Kiln turns may search repository text for planning and review.
    - tool: glob
      action: allow
      reason: Governed Kiln turns may discover files for planning and review.
    - tool: git
      action: allow
      reason: Governed Kiln plan and review turns may inspect repository status and diffs.
    - tool: resource_list
      action: allow
      reason: Governed Kiln turns may discover shared read-only resources.
    - tool: resource_template_list
      action: allow
      reason: Governed Kiln turns may discover shared read-only resource templates.
    - tool: resource_read
      action: allow
      reason: Governed Kiln turns may read shared resources.
