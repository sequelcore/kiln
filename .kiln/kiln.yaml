version: "1"
web:
  enabled: true
  netPolicy: full
interactiveUse:
  enabled: true
  browserProvider: playwright
  browserEnvironment: isolated-headless
  allowedDomains:
    - "*"
  allowComputer: true
  computerProvider: windows-uia
  computerEnvironment: local-active-desktop
  allowedApplications:
    - Calculator
    - msedge
    - notepad
  applicationAliases:
    Calculator:
      - Calculadora
      - CalculatorApp
      - calc
      - ApplicationFrameHost
    msedge:
      - Edge
      - Microsoft Edge
    notepad:
      - Notepad
      - Bloc de notas
      - notas
permissions:
  approval: on-request
  sandbox: workspace-write
