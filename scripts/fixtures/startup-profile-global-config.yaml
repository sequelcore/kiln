# Deterministic V5 operator intent for the GUI startup profile.
# Managed discovery, data-policy, and economic facts are published separately
# in the content-addressed evidence snapshot seeded by profile-startup.test.ts.
version: "5"

ui:
  appearance:
    mode: system
    themeByScheme:
      light: tesota
      dark: tesota
engines:
  claude:
    enabled: true
    billing: subscription
  codex:
    enabled: false
    billing: plus-quota
  opencode:
    enabled: false
    billing: free
permissionCeiling:
  approval: on-request
  sandbox: workspace-write
skills:
  builtin:
    enabled: true
workGovernance:
  defaultPosture: direct
  requireDelegationFor: []
  requiredEvidence: []
components:
  include:
    - baseline:core
targetCatalog:
  evidenceRevision: "sha256:aba2c76ffa80dbf3d57e5139e6c84c48c480ddebe455bfbe883bf58562b335fd"
  accounts:
    - id: startup-profile-account
      providerId: opencode-go
      credentialId: startup-profile-credential
      maxConcurrency: 1
      reservedAffinitySlots: 0
      economics:
        creditPosture: disabled
        overagePosture: disabled
  accountPolicies:
    - id: startup-profile-policy
      accountIds: [startup-profile-account]
      strategy: economic-least-pressure
  targets:
    - id: startup-profile-target
      kind: direct
      label: Startup profile fixture target
      providerId: opencode-go
      providerModelId: startup-profile-model
      dataClassification: internal
      accountPolicyId: startup-profile-policy
      economics:
        authBillingChannel: fixture
        executionMode: direct
        serviceTier: default
        fallbackPosture: disabled
        overagePosture: disabled
        executionEnvelope:
          limits: []
targetRouting:
  defaultTargetId: startup-profile-target
